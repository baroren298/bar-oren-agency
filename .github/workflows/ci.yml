name: CI

# Sprint 6B: minimal CI pipeline. Verifies the project stays healthy on every
# push and pull request — no database connection, no secrets, no migrations.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Node 22 matches this repo's local development runtime (v22.x) and is
      # an active LTS release compatible with Next.js 16 and Prisma 6.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Validates prisma/schema.prisma syntax only — does not connect to any
      # database, run migrations, or require DATABASE_URL/DIRECT_URL to be
      # set to a real value.
      - name: Validate Prisma schema
        run: npx prisma validate
